name: Build CF Server Monitor KSU Module

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest ARM64 probe
        run: |
          mkdir -p bin
      
          curl -fL --retry 3 --retry-delay 2 \
            -o bin/cf-probe \
            https://github.com/huilang-me/cfsm-agent/releases/latest/download/cf-probe-linux-arm64
      
          chmod 755 bin/cf-probe
      
          file bin/cf-probe

      - name: Read module version
        id: version
        shell: bash
        run: |
          VERSION=$(awk -F= '$1=="version"{print $2}' module.prop)
          VERSION_CODE=$(awk -F= '$1=="versionCode"{print $2}' module.prop)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build flashable ZIP
        shell: bash
        run: |
          rm -rf dist stage

          mkdir -p stage/CF-Server-Monitor-KSU
          mkdir -p dist

          cp -a \
            module.prop \
            skip_mount \
            boot-completed.sh \
            uninstall.sh \
            action.sh \
            bin \
            config \
            scripts \
            webroot \
            stage/CF-Server-Monitor-KSU/

          find stage/CF-Server-Monitor-KSU \
            -type f \
            -name "*.sh" \
            -exec chmod 755 {} +

          chmod 755 \
            stage/CF-Server-Monitor-KSU/bin/cf-probe

          cd stage/CF-Server-Monitor-KSU

          zip -r \
            ../../dist/CF-Server-Monitor-KSU.zip \
            .

      - name: Generate update.json
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"

          cat > update.json <<EOF
          {
            "version": "${VERSION}",
            "versionCode": ${VERSION_CODE},
            "zipUrl": "https://github.com/chendada00/CF-Server-Monitor-KSU/releases/latest/download/CF-Server-Monitor-KSU.zip",
            "changelog": "https://github.com/chendada00/CF-Server-Monitor-KSU/releases/latest"
          }
          EOF

      - name: Commit update.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add update.json

          if git diff --cached --quiet; then
            echo "update.json has no changes"
          else
            git commit -m "chore: update module metadata"
            git push origin HEAD:main
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CF-Server-Monitor-KSU
          path: |
            dist/CF-Server-Monitor-KSU.zip
            update.json

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/CF-Server-Monitor-KSU.zip
            update.json
