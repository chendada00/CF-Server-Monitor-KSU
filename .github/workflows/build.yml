name: Build and Release CF Server Monitor KSU Module

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cf-server-monitor-release-main
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read module version
        id: version
        shell: bash
        run: |
          VERSION="$(awk -F= '$1=="version"{print $2; exit}' module.prop | tr -d '\r\n[:space:]')"
          VERSION_CODE="$(awk -F= '$1=="versionCode"{print $2; exit}' module.prop | tr -d '\r\n[:space:]')"

          if [ -z "$VERSION" ]; then
            echo "ERROR: version is empty in module.prop"
            exit 1
          fi

          if [ -z "$VERSION_CODE" ]; then
            echo "ERROR: versionCode is empty in module.prop"
            exit 1
          fi

          case "$VERSION_CODE" in
            *[!0-9]*|'')
              echo "ERROR: versionCode must be a positive integer"
              exit 1
              ;;
          esac

          TAG="v${VERSION}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Module version: $VERSION"
          echo "Version code: $VERSION_CODE"
          echo "Release tag: $TAG"

      - name: Check whether this version already exists
        id: release
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=Git tag ${TAG} already exists"
            echo "Version ${TAG} already exists. Build only, release will be skipped."
            exit 0
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=GitHub Release ${TAG} already exists"
            echo "Version ${TAG} already exists. Build only, release will be skipped."
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "reason=New version detected"
          echo "New version ${TAG} detected. Release will be created."

      - name: Download CF Probe ARM64
        shell: bash
        run: |
          PROBE_VERSION="$(tr -d '[:space:]' < probe-version)"

          if [ -z "$PROBE_VERSION" ]; then
            echo "ERROR: probe-version is empty!"
            exit 1
          fi

          mkdir -p bin

          PROBE_URL="https://github.com/huilang-me/cfsm-agent/releases/download/${PROBE_VERSION}/cf-probe-linux-arm64"

          echo "Downloading CF Probe: ${PROBE_VERSION}"
          echo "URL: ${PROBE_URL}"

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            -o bin/cf-probe \
            "$PROBE_URL"

          chmod 755 bin/cf-probe

          echo
          echo "Binary information:"
          file bin/cf-probe

          echo
          echo "Checking ARM64 architecture..."

          file bin/cf-probe | grep -Eq 'ARM aarch64|ARM64' || {
            echo "ERROR: Downloaded cf-probe is not ARM64!"
            exit 1
          }

          echo "ARM64 binary check passed."

      - name: Build flashable ZIP
        shell: bash
        run: |
          rm -rf dist stage

          mkdir -p stage/module
          mkdir -p dist

          cp -a \
            module.prop \
            skip_mount \
            customize.sh \
            boot-completed.sh \
            uninstall.sh \
            action.sh \
            bin \
            config \
            scripts \
            webroot \
            stage/module/

          chmod 755 \
            stage/module/customize.sh \
            stage/module/boot-completed.sh \
            stage/module/uninstall.sh \
            stage/module/action.sh \
            stage/module/scripts/manager.sh \
            stage/module/scripts/save-config.sh \
            stage/module/bin/cf-probe

          cd stage/module

          zip -r \
            ../../dist/CF-Server-Monitor-KSU.zip \
            .

          cd ../..

          echo "ZIP created:"
          ls -lh dist/CF-Server-Monitor-KSU.zip

      - name: Generate update.json
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > update.json <<EOF
          {
            "version": "${VERSION}",
            "versionCode": ${VERSION_CODE},
            "zipUrl": "https://github.com/chendada00/CF-Server-Monitor-KSU/releases/download/${TAG}/CF-Server-Monitor-KSU.zip",
            "changelog": "https://github.com/chendada00/CF-Server-Monitor-KSU/releases/tag/${TAG}"
          }
          EOF

          cat update.json

          python3 -m json.tool update.json >/dev/null

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CF-Server-Monitor-KSU-${{ steps.version.outputs.tag }}
          path: |
            dist/CF-Server-Monitor-KSU.zip
            update.json
          if-no-files-found: error
          retention-days: 14

      - name: Create Git tag
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          echo "Created tag: $TAG"

      - name: Commit update.json to main
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add update.json

          if git diff --cached --quiet; then
            echo "update.json has no changes"
          else
            git commit \
              -m "chore: update module metadata to v${{ steps.version.outputs.version }} [skip ci]"

            git push origin HEAD:main

            echo "update.json committed to main"
          fi

      - name: Create GitHub Release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: CF Server Monitor KSU ${{ steps.version.outputs.version }}
          body: |
            ## CF Server Monitor KSU

            自动构建发布。

            更新内容请查看本次提交记录。
          files: |
            dist/CF-Server-Monitor-KSU.zip
            update.json

      - name: Build summary
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          TAG: ${{ steps.version.outputs.tag }}
          PUBLISH: ${{ steps.release.outputs.publish }}
          REASON: ${{ steps.release.outputs.reason }}
        run: |
          {
            echo "## CF Server Monitor KSU Build"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- VersionCode: \`${VERSION_CODE}\`"
            echo "- Tag: \`${TAG}\`"
            echo "- Release: \`${PUBLISH}\`"
            echo "- Reason: ${REASON}"
          } >> "$GITHUB_STEP_SUMMARY"