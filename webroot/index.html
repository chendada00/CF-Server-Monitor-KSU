<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1">

<title>CF Server Monitor</title>

<style>

:root {
    color-scheme: dark;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 16px;

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #111;
    color: #eee;
}

.card {
    background: #1d1d1f;

    border-radius: 16px;

    padding: 16px;

    margin-bottom: 14px;
}

h1,
h2 {
    margin: 0 0 12px;
}

h1 {
    font-size: 22px;
}

h2 {
    font-size: 17px;
}

.row {
    display: flex;

    gap: 8px;

    flex-wrap: wrap;
}

button {
    border: 0;

    border-radius: 10px;

    padding: 11px 14px;

    background: #3a3a3c;

    color: #fff;

    font-size: 15px;
}

button.primary {
    background: #0a84ff;
}

button.danger {
    background: #ff453a;
}

button:disabled {
    opacity: .5;
}

input,
select {
    width: 100%;

    padding: 12px;

    border: 1px solid #444;

    border-radius: 10px;

    background: #2c2c2e;

    color: #fff;

    font-size: 16px;
}

label {
    display: block;

    margin: 12px 0 6px;
}

pre {
    white-space: pre-wrap;

    word-break: break-word;

    max-height: 420px;

    overflow: auto;

    margin: 0;
}

.badge {
    font-weight: 700;

    font-size: 16px;
}

.running {
    color: #30d158;
}

.stopped {
    color: #ff453a;
}

.muted {
    color: #aaa;

    font-size: 13px;
}

.small {
    color: #aaa;

    font-size: 12px;

    margin-top: 6px;
}

#message {
    min-height: 24px;
}

.switch-row {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;

    margin-top: 12px;
}

.switch-row label {
    margin: 0;
}

.switch {
    width: 52px;
    height: 30px;

    position: relative;

    appearance: none;

    background: #555;

    border-radius: 20px;

    cursor: pointer;

    transition: .2s;
}

.switch:checked {
    background: #30d158;
}

.switch::after {
    content: "";

    position: absolute;

    width: 24px;
    height: 24px;

    top: 3px;
    left: 3px;

    background: #fff;

    border-radius: 50%;

    transition: .2s;
}

.switch:checked::after {
    transform: translateX(22px);
}

#loadingOverlay {

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 24px;

    background: rgba(0, 0, 0, .72);

    backdrop-filter: blur(5px);
}

#loadingOverlay.show {
    display: flex;
}

.loadingBox {

    width: 100%;

    max-width: 330px;

    padding: 24px;

    text-align: center;

    background: #1d1d1f;

    border-radius: 20px;
}

.spinner {

    width: 42px;
    height: 42px;

    margin: 0 auto 16px;

    border: 4px solid rgba(255,255,255,.18);

    border-top-color: #0a84ff;

    border-radius: 50%;

    animation: spin .8s linear infinite;
}

#loadingText {

    font-size: 16px;

    font-weight: 600;
}

#loadingDetail {

    margin-top: 8px;

    color: #aaa;

    font-size: 13px;

    white-space: pre-wrap;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }
}

</style>

<script type="module">

const MODDIR =
    '/data/adb/modules/cf-server-monitor';

const MANAGER =
    `${MODDIR}/scripts/manager.sh`;

const CONFIG =
    '/data/adb/cf-server-monitor/config.conf';

const SAVER =
    `${MODDIR}/scripts/save-config.sh`;

const ACTION_LOG =
    '/data/adb/cf-server-monitor/webui-action.log';

const $ =
    id => document.getElementById(id);


let exec;

try {

    const kernelsu =
        await import('./kernelsu.js');

    exec =
        kernelsu.exec;

    if (
        typeof exec !== 'function'
    ) {

        throw new Error(
            'KernelSU exec API 不可用'
        );
    }

} catch (error) {

    document.addEventListener(
        'DOMContentLoaded',
        function () {

            $('message').textContent =
                'WebUI 初始化失败：\n' +
                (
                    error?.message ||
                    String(error)
                );
        }
    );
}


function shellQuote(value) {

    return "'" +
        String(value)
            .replace(
                /'/g,
                "'\\''"
            ) +
        "'";
}


async function run(command) {

    if (
        typeof exec !== 'function'
    ) {

        throw new Error(
            'KernelSU WebUI API 不可用'
        );
    }

    const result =
        await exec(command);

    const stdout =
        result?.stdout || '';

    const stderr =
        result?.stderr || '';

    const output =
        [stdout, stderr]
            .filter(Boolean)
            .join('\n')
            .trim();

    return {
        errno:
            result?.errno ?? 0,

        stdout,

        stderr,

        output
    };
}


function parseConfig(text) {

    const result = {};

    for (
        const line of
        text.split(/\r?\n/)
    ) {

        const match =
            line.match(
                /^([A-Z_]+)="(.*)"$/
            );

        if (!match) {
            continue;
        }

        result[match[1]] =
            match[2].replace(
                /\\(["\\$`])/g,
                '$1'
            );
    }

    return result;
}


function b64Utf8(text) {

    const bytes =
        new TextEncoder()
            .encode(text);

    let binary = '';

    for (const byte of bytes) {

        binary +=
            String.fromCharCode(byte);
    }

    return btoa(binary);
}


function setMessage(text) {

    $('message').textContent =
        text || '';
}


function showLoading(
    text,
    detail
) {

    $('loadingText').textContent =
        text || '正在执行操作...';

    $('loadingDetail').textContent =
        detail || '请稍候...';

    $('loadingOverlay')
        .classList
        .add('show');
}


function hideLoading() {

    $('loadingOverlay')
        .classList
        .remove('show');
}


function updateLoading(text) {

    $('loadingDetail').textContent =
        text || '';
}


function setButtonsDisabled(disabled) {

    document
        .querySelectorAll('button')
        .forEach(
            button => {

                button.disabled =
                    disabled;
            }
        );
}


async function refreshStatus() {

    try {

        const result =
            await run(
                `${shellQuote(MANAGER)} status`
            );

        const output =
            result.output;

        const running =
            output.includes(
                '运行状态：运行中'
            );

        $('status').textContent =
            running
                ? '● 探针运行中'
                : '● 探针已停止';

        $('status').className =
            'badge ' +
            (
                running
                    ? 'running'
                    : 'stopped'
            );

        $('statusDetail').textContent =
            output;

    } catch (error) {

        $('status').textContent =
            '● 状态读取失败';

        $('status').className =
            'badge stopped';

        $('statusDetail').textContent =
            String(error);
    }
}


async function loadConfig() {

    const result =
        await run(
            'cat ' +
            shellQuote(CONFIG)
        );

    const config =
        parseConfig(
            result.stdout
        );

    $('serverId').value =
        config.SERVER_ID || '';

    $('secret').value =
        config.SECRET || '';

    $('workerUrl').value =
        config.WORKER_URL || '';

    $('collectInterval').value =
        config.COLLECT_INTERVAL || '0';

    $('reportInterval').value =
        config.REPORT_INTERVAL || '60';

    $('resetDay').value =
        config.RESET_DAY || '1';

    $('connectionMode').value =
        config.CONNECTION_MODE || 'auto';

    $('ctNode').value =
        config.CT_NODE || '';

    $('cuNode').value =
        config.CU_NODE || '';

    $('cmNode').value =
        config.CM_NODE || '';

    $('bdNode').value =
        config.BD_NODE || '';

    $('interface').value =
        config.INTERFACE || '';

    $('autoUpdate').value =
        config.AUTO_UPDATE || '0';

    $('updateProxy').value =
        config.UPDATE_PROXY || '';

    $('debug').checked =
        config.DEBUG === '1';

    $('logMaxSize').value =
        config.LOG_MAX_SIZE_MB || '5';

    $('logKeepCount').value =
        config.LOG_KEEP_COUNT || '3';
}


async function saveConfig(
    restart = false
) {

    const payload = [

        `SERVER_ID=${$('serverId').value.trim()}`,

        `SECRET=${$('secret').value.trim()}`,

        `WORKER_URL=${$('workerUrl').value.trim()}`,

        `COLLECT_INTERVAL=${$('collectInterval').value}`,

        `REPORT_INTERVAL=${$('reportInterval').value}`,

        `RESET_DAY=${$('resetDay').value}`,

        `CONNECTION_MODE=${$('connectionMode').value}`,

        `CT_NODE=${$('ctNode').value.trim()}`,

        `CU_NODE=${$('cuNode').value.trim()}`,

        `CM_NODE=${$('cmNode').value.trim()}`,

        `BD_NODE=${$('bdNode').value.trim()}`,

        `INTERFACE=${$('interface').value.trim()}`,

        `AUTO_UPDATE=${$('autoUpdate').value}`,

        `UPDATE_PROXY=${$('updateProxy').value.trim()}`,

        `DEBUG=${$('debug').checked ? '1' : '0'}`,

        `LOG_MAX_SIZE_MB=${$('logMaxSize').value}`,

        `LOG_KEEP_COUNT=${$('logKeepCount').value}`

    ].join('\n');

    const encoded =
        b64Utf8(payload);

    setButtonsDisabled(true);

    showLoading(
        '正在保存配置...',
        '正在写入配置文件'
    );

    try {

        const result =
            await run(
                `printf %s ${shellQuote(encoded)} | ` +
                `${shellQuote(SAVER)}`
            );

        if (
            !result.output.includes('OK')
        ) {

            throw new Error(
                result.output ||
                '保存失败'
            );
        }

        if (restart) {

            await backgroundAction(
                'restart',
                false
            );

        } else {

            setMessage(
                '配置保存成功。\n' +
                '部分设置需要重启探针后才会生效。'
            );
        }

        await refreshStatus();

    } catch (error) {

        setMessage(
            '[错误]\n' +
            (
                error?.message ||
                String(error)
            )
        );

    } finally {

        hideLoading();

        setButtonsDisabled(false);
    }
}


async function backgroundAction(
    name,
    manageUi = true
) {

    if (manageUi) {

        setButtonsDisabled(true);

        showLoading(
            '正在执行：' + name,
            '正在启动后台任务...'
        );
    }

    try {

        const command =
            `${shellQuote(MANAGER)} ${shellQuote(name)} ` +
            `> ${shellQuote(ACTION_LOG)} 2>&1`;

        const background =
            '/system/bin/sh -c ' +
            shellQuote(
                command +
                ' & echo $!'
            );

        const start =
            await run(background);

        const pid =
            String(start.stdout || '')
                .trim()
                .split(/\s+/)
                .pop();

        if (
            !/^\d+$/.test(pid || '')
        ) {

            throw new Error(
                start.output ||
                '无法启动后台操作'
            );
        }

        let lastOutput =
            '';

        const startTime =
            Date.now();

        const maxWait =
            30000;

        while (true) {

            const logResult =
                await run(
                    'cat ' +
                    shellQuote(ACTION_LOG) +
                    ' 2>/dev/null'
                );

            const output =
                logResult.stdout ||
                '';

            if (
                output !== lastOutput
            ) {

                lastOutput =
                    output;

                setMessage(
                    output ||
                    '正在执行...'
                );

                const lines =
                    output
                        .trim()
                        .split(/\r?\n/);

                updateLoading(
                    lines
                        .slice(-2)
                        .join('\n')
                );
            }

            const alive =
                await run(
                    `kill -0 ${pid} 2>/dev/null`
                );

            if (
                alive.errno !== 0
            ) {
                break;
            }

            if (
                Date.now() -
                startTime >
                maxWait
            ) {

                updateLoading(
                    '操作仍在后台执行，停止页面等待。'
                );

                break;
            }

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        500
                    )
            );
        }

        const finalResult =
            await run(
                'cat ' +
                shellQuote(ACTION_LOG) +
                ' 2>/dev/null'
            );

        if (
            finalResult.stdout
        ) {

            setMessage(
                finalResult.stdout
            );
        }

        await refreshStatus();

        await showLogs();

    } catch (error) {

        setMessage(
            '[操作失败]\n' +
            (
                error?.stack ||
                error?.message ||
                String(error)
            )
        );

    } finally {

        if (manageUi) {

            hideLoading();

            setButtonsDisabled(false);
        }
    }
}


window.action =
    async function (name) {

        await backgroundAction(
            name
        );
    };


window.saveConfig =
    saveConfig;


window.refreshStatus =
    refreshStatus;


window.showLogs =
    async function () {

        try {

            const result =
                await run(
                    `${shellQuote(MANAGER)} logs`
                );

            $('logs').textContent =
                result.output ||
                '暂无日志。';

        } catch (error) {

            $('logs').textContent =
                '读取日志失败：\n' +
                String(error);
        }
    };


window.clearLogs =
    async function () {

        if (
            !confirm(
                '确定要清空全部日志吗？'
            )
        ) {
            return;
        }

        await backgroundAction(
            'clear-logs'
        );
    };


window.toggleDebug =
    async function () {

        await backgroundAction(
            'toggle-debug'
        );

        await loadConfig();
    };


document.addEventListener(
    'DOMContentLoaded',
    async function () {

        try {

            await loadConfig();

            await refreshStatus();

            await showLogs();

            setInterval(
                refreshStatus,
                10000
            );

        } catch (error) {

            setMessage(
                '初始化失败：\n' +
                String(error)
            );
        }
    }
);

</script>

</head>

<body>

<div id="loadingOverlay">

    <div class="loadingBox">

        <div class="spinner"></div>

        <div id="loadingText">
            正在执行操作...
        </div>

        <div id="loadingDetail">
            请稍候...
        </div>

    </div>

</div>


<div class="card">

    <h1>
        CF Server Monitor
    </h1>

    <div
        id="status"
        class="badge">

        加载中...

    </div>

    <pre
        id="statusDetail"
        class="muted">
    </pre>

</div>


<div class="card">

    <h2>
        探针控制
    </h2>

    <div class="row">

        <button
            class="primary"
            onclick="action('start')">

            启动

        </button>

        <button
            onclick="action('stop')">

            停止

        </button>

        <button
            onclick="action('restart')">

            重启

        </button>

        <button
            onclick="refreshStatus()">

            刷新状态

        </button>

    </div>

</div>


<div class="card">

    <h2>
        调试模式
    </h2>

    <div class="switch-row">

        <label>
            开启详细调试日志
        </label>

        <input
            id="debug"
            class="switch"
            type="checkbox">

    </div>

    <div class="small">

        开启后会记录更多网络、上报和探测信息，
        日志增长速度也会明显增加。

    </div>

    <div
        class="row"
        style="margin-top:12px">

        <button
            onclick="toggleDebug()">

            立即切换调试状态

        </button>

    </div>

</div>


<div class="card">

    <h2>
        连接配置
    </h2>

    <label>
        Agent ID
    </label>

<input
    id="serverId"
    autocomplete="off">


    <label>
        Secret
    </label>

    <input
        id="secret"
        type="password"
        autocomplete="off">


    <label>
        服务端地址
    </label>

<input
    id="workerUrl"
    type="url"
    autocomplete="off">


    <label>
        上报间隔（秒）
    </label>

<input
    id="reportInterval"
    type="number"
    min="0">


    <label>
        采集间隔（秒）
    </label>

    <input
        id="collectInterval"
        type="number"
        min="0">


    <label>
        连接方式
    </label>

    <select id="connectionMode">

        <option value="auto">
            auto
        </option>

        <option value="http">
            http
        </option>

    </select>


    <div
        class="row"
        style="margin-top:16px">

        <button
            onclick="saveConfig(false)">

            保存配置

        </button>

        <button
            class="primary"
            onclick="saveConfig(true)">

            保存并重启

        </button>

    </div>

</div>


<div class="card">

    <h2>
        日志管理
    </h2>

    <label>
        单个日志最大大小（MB）
    </label>

    <input
        id="logMaxSize"
        type="number"
        min="1">


    <label>
        保留历史日志数量
    </label>

    <input
        id="logKeepCount"
        type="number"
        min="1"
        max="20">


    <div class="small">

        超过最大大小后自动轮转。
        例如 5MB、保留 3 个，
        最多大约占用 20MB。

    </div>


    <div
        class="row"
        style="margin-top:16px">

        <button
            onclick="showLogs()">

            刷新日志

        </button>

        <button
            class="danger"
            onclick="clearLogs()">

            清空日志

        </button>

    </div>

    <pre
        id="logs">

正在加载日志...

    </pre>

</div>


<div class="card">

    <h2>
        操作结果
    </h2>

    <pre id="message"></pre>

</div>

</body>

</html>
