<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1">

<title>CF Server Monitor</title>


<style>

:root {
    color-scheme: dark;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 16px;

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #111;
    color: #eee;
}

.card {
    background: #1d1d1f;

    border-radius: 16px;

    padding: 16px;

    margin-bottom: 14px;
}

h1,
h2 {
    margin: 0 0 12px;
}

h1 {
    font-size: 22px;
}

h2 {
    font-size: 17px;
}

.row {
    display: flex;

    gap: 8px;

    flex-wrap: wrap;
}

button {
    border: 0;

    border-radius: 10px;

    padding: 11px 14px;

    background: #3a3a3c;

    color: #fff;

    font-size: 15px;
}

button.primary {
    background: #0a84ff;
}

button.danger {
    background: #ff453a;
}

button:disabled {
    opacity: .45;
}

input,
select {
    width: 100%;

    padding: 12px;

    border: 1px solid #444;

    border-radius: 10px;

    background: #2c2c2e;

    color: #fff;

    font-size: 16px;
}

label {
    display: block;

    margin: 12px 0 6px;
}

pre {
    white-space: pre-wrap;

    word-break: break-word;

    max-height: 420px;

    overflow: auto;

    margin: 0;
}

.badge {
    font-weight: 700;

    font-size: 16px;
}

.running {
    color: #30d158;
}

.stopped {
    color: #ff453a;
}

.muted {
    color: #aaa;

    font-size: 13px;
}

.small {
    color: #aaa;

    font-size: 12px;

    margin-top: 6px;
}

#message {
    min-height: 24px;
}

.switch-row {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;

    margin-top: 12px;
}

.switch-row label {
    margin: 0;
}

.switch {
    width: 52px;

    height: 30px;

    position: relative;

    appearance: none;

    background: #555;

    border-radius: 20px;

    cursor: pointer;

    transition: .2s;
}

.switch:checked {
    background: #30d158;
}

.switch::after {
    content: "";

    position: absolute;

    width: 24px;

    height: 24px;

    top: 3px;

    left: 3px;

    background: #fff;

    border-radius: 50%;

    transition: .2s;
}

.switch:checked::after {
    transform: translateX(22px);
}

#loadingOverlay {
    position: fixed;

    inset: 0;

    z-index: 9999;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 24px;

    background: rgba(0,0,0,.72);

    backdrop-filter: blur(5px);
}

#loadingOverlay.show {
    display: flex;
}

.loadingBox {
    width: 100%;

    max-width: 340px;

    padding: 24px;

    text-align: center;

    background: #1d1d1f;

    border-radius: 20px;
}

.spinner {
    width: 42px;

    height: 42px;

    margin: 0 auto 16px;

    border: 4px solid rgba(255,255,255,.18);

    border-top-color: #0a84ff;

    border-radius: 50%;

    animation: spin .8s linear infinite;
}

#loadingText {
    font-size: 16px;

    font-weight: 600;
}

#loadingDetail {
    margin-top: 8px;

    color: #aaa;

    font-size: 13px;

    white-space: pre-wrap;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}

</style>


<script type="module">

import {
    exec,
    toast
} from './kernelsu.js';


const MODDIR =
    '/data/adb/modules/cf-server-monitor';


const MANAGER =
    `${MODDIR}/scripts/manager.sh`;


const $ =
    id => document.getElementById(id);


let initialized = false;

let statusTimer = null;

let busy = false;


function quote(value) {

    return "'" +
        String(value)
            .replace(
                /'/g,
                "'\\''"
            ) +
        "'";
}


async function run(command) {

    let result;

    try {

        result =
            await exec(command);

    } catch (error) {

        throw new Error(
            error?.message ||
            String(error)
        );
    }


    const stdout =
        result?.stdout || '';

    const stderr =
        result?.stderr || '';

    const errno =
        Number(
            result?.errno ?? 0
        );


    const output =
        [
            stdout,
            stderr
        ]
        .filter(
            value =>
                value !== ''
        )
        .join('\n')
        .trim();


    return {
        errno,
        stdout,
        stderr,
        output
    };
}


function setMessage(
    message
) {

    $('message').textContent =
        message || '';
}


function loading(
    show,
    title,
    detail
) {

    if (show) {

        $('loadingText')
            .textContent =
                title ||
                '正在执行...';

        $('loadingDetail')
            .textContent =
                detail ||
                '请稍候...';

        $('loadingOverlay')
            .classList
            .add('show');

    } else {

        $('loadingOverlay')
            .classList
            .remove('show');
    }
}


function disableButtons(
    disabled
) {

    document
        .querySelectorAll('button')
        .forEach(
            button => {

                button.disabled =
                    disabled;
            }
        );
}


function parseKeyValue(
    text
) {

    const data = {};


    String(text || '')
        .split(/\r?\n/)
        .forEach(
            line => {

                const index =
                    line.indexOf('=');


                if (index <= 0) {
                    return;
                }


                const key =
                    line
                        .substring(
                            0,
                            index
                        )
                        .trim();


                let value =
                    line
                        .substring(
                            index + 1
                        )
                        .trim();


                if (
                    value.length >= 2 &&
                    value.startsWith('"') &&
                    value.endsWith('"')
                ) {

                    value =
                        value.substring(
                            1,
                            value.length - 1
                        );
                }


                data[key] =
                    value;
            }
        );


    return data;
}


function utf8Base64(
    text
) {

    const bytes =
        new TextEncoder()
            .encode(text);


    let binary = '';


    for (
        const byte of bytes
    ) {

        binary +=
            String.fromCharCode(
                byte
            );
    }


    return btoa(binary);
}


async function loadConfig() {

    const result =
        await run(
            `${quote(MANAGER)} get-config`
        );


    if (
        result.errno !== 0
    ) {

        throw new Error(
            'manager.sh get-config 执行失败\n\n' +
            result.output
        );
    }


    if (
        !result.stdout.trim()
    ) {

        throw new Error(
            'manager.sh 没有返回配置数据'
        );
    }


    const config =
        parseKeyValue(
            result.stdout
        );


    $('serverId').value =
        config.SERVER_ID || '';


    $('secret').value =
        config.SECRET || '';


    $('workerUrl').value =
        config.WORKER_URL || '';


    $('collectInterval').value =
        config.COLLECT_INTERVAL || '0';


    $('reportInterval').value =
        config.REPORT_INTERVAL || '60';


    $('connectionMode').value =
        config.CONNECTION_MODE ||
        'auto';


    $('debug').checked =
        config.DEBUG === '1';


    $('logMaxSize').value =
        config.LOG_MAX_SIZE_MB ||
        '5';


    $('logKeepCount').value =
        config.LOG_KEEP_COUNT ||
        '3';


    setMessage(
        `配置读取成功\n配置文件：${config.CONFIG_FILE || '未知'}`
    );
}


async function refreshStatus() {

    try {

        const result =
            await run(
                `${quote(MANAGER)} status`
            );


        const output =
            result.output;


        if (
            result.errno !== 0
        ) {

            throw new Error(
                output ||
                'status 执行失败'
            );
        }


        const running =
            output.includes(
                '运行状态：运行中'
            );


        $('status').textContent =
            running
                ? '● 探针运行中'
                : '● 探针已停止';


        $('status').className =
            'badge ' +
            (
                running
                    ? 'running'
                    : 'stopped'
            );


        $('statusDetail')
            .textContent =
                output;


    } catch (error) {

        $('status').textContent =
            '● 状态读取失败';


        $('status').className =
            'badge stopped';


        $('statusDetail')
            .textContent =
                error?.message ||
                String(error);
    }
}


async function showLogs() {

    try {

        const result =
            await run(
                `${quote(MANAGER)} logs`
            );


        $('logs').textContent =
            result.output ||
            '暂无日志。';


    } catch (error) {

        $('logs').textContent =
            '日志读取失败：\n' +
            (
                error?.message ||
                String(error)
            );
    }
}


async function executeAction(
    action
) {

    if (busy) {
        return;
    }


    busy = true;

    disableButtons(true);


    loading(
        true,
        `正在执行：${action}`,
        '正在等待 manager.sh 完成，请稍候...'
    );


    try {

        /*
         * 这里不再自己构造后台 sh。
         *
         * 直接等待 manager.sh 完成。
         *
         * 这样可以确保：
         *
         * restart 完成
         * stop 完成
         * toggle-debug 完成
         *
         * 后面再读取 status。
         */

        const result =
            await run(
                `${quote(MANAGER)} ${quote(action)}`
            );


        const output =
            result.output ||
            '(无输出)';


        if (
            result.errno !== 0
        ) {

            throw new Error(
                output
            );
        }


        setMessage(
            output
        );


        await refreshStatus();

        await showLogs();


    } catch (error) {

        setMessage(
            '[操作失败]\n\n' +
            (
                error?.message ||
                String(error)
            )
        );


        await refreshStatus();

    } finally {

        loading(false);

        disableButtons(false);

        busy = false;
    }
}


async function saveConfig(
    restart
) {

    if (busy) {
        return;
    }


    const serverId =
        $('serverId')
            .value
            .trim();


    const secret =
        $('secret')
            .value
            .trim();


    const workerUrl =
        $('workerUrl')
            .value
            .trim();


    if (!serverId) {

        setMessage(
            '[错误] Agent ID 不能为空'
        );

        return;
    }


    if (!secret) {

        setMessage(
            '[错误] Secret 不能为空'
        );

        return;
    }


    if (!workerUrl) {

        setMessage(
            '[错误] 服务端地址不能为空'
        );

        return;
    }


    const config = [

        `SERVER_ID=${serverId}`,

        `SECRET=${secret}`,

        `WORKER_URL=${workerUrl}`,

        `COLLECT_INTERVAL=${$('collectInterval').value}`,

        `REPORT_INTERVAL=${$('reportInterval').value}`,

        `CONNECTION_MODE=${$('connectionMode').value}`,

        `DEBUG=${$('debug').checked ? '1' : '0'}`,

        `LOG_MAX_SIZE_MB=${$('logMaxSize').value}`,

        `LOG_KEEP_COUNT=${$('logKeepCount').value}`

    ].join('\n');


    const encoded =
        utf8Base64(
            config
        );


    busy = true;

    disableButtons(true);


    loading(
        true,
        '正在保存配置',
        '正在写入 /data/adb/cf-server-monitor/config.conf'
    );


    try {

        const result =
            await run(
                `${quote(MANAGER)} save-config ${quote(encoded)}`
            );


        if (
            result.errno !== 0
        ) {

            throw new Error(
                result.output ||
                '保存配置失败'
            );
        }


        /*
         * 保存后马上重新读取。
         *
         * 如果这里读取不到，
         * 就直接报错，而不是静默。
         */

        await loadConfig();


        if (restart) {

            loading(
                true,
                '配置已保存',
                '正在重启 cf-probe 并验证新进程...'
            );


            const restartResult =
                await run(
                    `${quote(MANAGER)} restart`
                );


            if (
                restartResult.errno !== 0
            ) {

                throw new Error(
                    restartResult.output ||
                    '重启失败'
                );
            }


            setMessage(
                restartResult.output ||
                '配置已保存并重启成功。'
            );

        } else {

            setMessage(
                '配置保存成功。'
            );
        }


        await refreshStatus();

        await showLogs();


    } catch (error) {

        setMessage(
            '[保存失败]\n\n' +
            (
                error?.message ||
                String(error)
            )
        );

    } finally {

        loading(false);

        disableButtons(false);

        busy = false;
    }
}


async function clearLogs() {

    if (
        !confirm(
            '确定要清空全部日志吗？'
        )
    ) {

        return;
    }


    await executeAction(
        'clear-logs'
    );
}


async function toggleDebug() {

    await executeAction(
        'toggle-debug'
    );


    /*
     * toggle-debug 已经完成：
     *
     * 修改配置
     * ↓
     * restart
     * ↓
     * 验证实际 PID
     *
     * 所以这里再重新读取一次配置。
     */

    try {

        await loadConfig();

    } catch (error) {

        setMessage(
            '[警告] Debug 已执行，但重新读取配置失败：\n' +
            (
                error?.message ||
                String(error)
            )
        );
    }
}


async function init() {

    if (initialized) {
        return;
    }


    initialized = true;


    setMessage(
        '正在初始化 WebUI...'
    );


    try {

        /*
         * 三个初始化操作依次执行。
         *
         * 不使用 Promise.all，
         * 避免多个 ksu.exec 同时初始化时
         * 在部分 KernelSU WebView 环境下发生竞态。
         */

        await loadConfig();

        await refreshStatus();

        await showLogs();


        setMessage(
            '初始化完成。'
        );


        if (statusTimer) {
            clearInterval(statusTimer);
        }


        /*
         * 每 3 秒主动执行一次 manager status。
         *
         * 注意：
         *
         * 这里刷新的是 cf-probe 的真实 PID，
         * 不是读取旧 PID 文件直接显示。
         */

        statusTimer =
            setInterval(
                async () => {

                    if (
                        !busy
                    ) {

                        await refreshStatus();
                    }

                },
                3000
            );


    } catch (error) {

        /*
         * 任何初始化错误都必须显示。
         */

        setMessage(
            '[WebUI 初始化失败]\n\n' +
            (
                error?.message ||
                String(error)
            )
        );


        $('status').textContent =
            '● 初始化失败';


        $('status').className =
            'badge stopped';


        $('statusDetail')
            .textContent =
                (
                    error?.message ||
                    String(error)
                );
    }
}


window.action =
    executeAction;


window.saveConfig =
    saveConfig;


window.refreshStatus =
    refreshStatus;


window.showLogs =
    showLogs;


window.clearLogs =
    clearLogs;


window.toggleDebug =
    toggleDebug;


/*
 * 不再使用 DOMContentLoaded。
 *
 * 因为这是 module script，
 * 页面加载完成后直接初始化。
 */

if (
    document.readyState ===
    'loading'
) {

    window.addEventListener(
        'load',
        init,
        {
            once: true
        }
    );

} else {

    init();
}


document.addEventListener(
    "visibilitychange",
    () => {
        if (document.visibilityState === "visible") {
            if (typeof refreshStatus === "function") {
                refreshStatus();
            }
        }
    }
);

</script>

</head>


<body>


<div id="loadingOverlay">

    <div class="loadingBox">

        <div class="spinner"></div>

        <div id="loadingText">
            正在执行操作...
        </div>

        <div id="loadingDetail">
            请稍候...
        </div>

    </div>

</div>


<div class="card">

    <h1>
        CF Server Monitor
    </h1>


    <div
        id="status"
        class="badge stopped">

        正在读取状态...

    </div>


    <pre
        id="statusDetail"
        class="muted">
    </pre>

</div>


<div class="card">

    <h2>
        探针控制
    </h2>


    <div class="row">

        <button
            class="primary"
            onclick="action('start')">

            启动

        </button>


        <button
            class="danger"
            onclick="action('stop')">

            停止

        </button>


        <button
            onclick="action('restart')">

            重启

        </button>


        <button
            onclick="refreshStatus()">

            刷新状态

        </button>

    </div>

</div>


<div class="card">

    <h2>
        调试模式
    </h2>


    <div class="switch-row">

        <label>
            开启详细调试日志
        </label>


        <input
            id="debug"
            class="switch"
            type="checkbox">

    </div>


    <div class="small">

        切换后会自动重启 cf-probe，并验证实际进程是否使用对应的 -debug 参数。

    </div>


    <div
        class="row"
        style="margin-top:12px">

        <button
            onclick="toggleDebug()">

            切换 Debug 并立即生效

        </button>

    </div>

</div>


<div class="card">

    <h2>
        连接配置
    </h2>


    <label>
        Agent ID
    </label>


    <input
        id="serverId"
        autocomplete="off">


    <label>
        Secret
    </label>


    <input
        id="secret"
        type="password"
        autocomplete="off">


    <label>
        服务端地址
    </label>


    <input
        id="workerUrl"
        type="url"
        autocomplete="off">


    <label>
        上报间隔（秒）
    </label>


    <input
        id="reportInterval"
        type="number"
        min="0">


    <label>
        采集间隔（秒）
    </label>


    <input
        id="collectInterval"
        type="number"
        min="0">


    <label>
        连接方式
    </label>


    <select id="connectionMode">

        <option value="auto">
            auto
        </option>

        <option value="http">
            http
        </option>

    </select>


    <div
        class="row"
        style="margin-top:16px">

        <button
            onclick="saveConfig(false)">

            保存配置

        </button>


        <button
            class="primary"
            onclick="saveConfig(true)">

            保存并重启

        </button>

    </div>

</div>


<div class="card">

    <h2>
        日志管理
    </h2>


    <label>
        单个日志最大大小（MB）
    </label>


    <input
        id="logMaxSize"
        type="number"
        min="1">


    <label>
        保留历史日志数量
    </label>


    <input
        id="logKeepCount"
        type="number"
        min="1"
        max="20">


    <div
        class="row"
        style="margin-top:16px">

        <button
            onclick="showLogs()">

            刷新日志

        </button>


        <button
            class="danger"
            onclick="clearLogs()">

            清空日志

        </button>

    </div>

</div>


<div class="card">

    <h2>
        消息
    </h2>


    <pre
        id="message"
        class="muted">
    </pre>

</div>


<div class="card">

    <h2>
        日志
    </h2>


    <pre id="logs">
    </pre>

</div>


</body>

</html>
